name: Swarm Checkin

on:
  # repository_dispatch は旧経路 (IFTTT Pro Webhooks → GitHub API) の名残。通常運用は sync-swarm-sheet.yml (cron)。
  # IFTTT の Webhooks applet を Archive して Free に落としたら、この trigger は削除してよい。
  repository_dispatch:
    types: [swarm-checkin]
  workflow_dispatch:
    inputs:
      payload:
        description: "Test payload (JSON object). Default is a sample for dry-run testing."
        required: false
        default: '{"checkinUrl":"https://www.swarmapp.com/c/test","createdAt":"2026-04-29T10:00:00Z","venueName":"テストカフェ","venueCategory":"Coffee Shop","address":"東京都新宿区","lat":"35.690500","lng":"139.700400","shout":"テスト"}'
      migrate_only:
        description: "Skip the payload and only re-normalize existing checkins (coarsen dates / rebuild ids)."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

# sync-swarm-sheet.yml と同じ GCS ファイルを read-modify-write するので直列化。
concurrency:
  group: swarm-checkins
  cancel-in-progress: false

jobs:
  append-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/130346180231/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: gha-feed-writer@basecamp-satory074.iam.gserviceaccount.com

      - name: Append checkin
        env:
          GCS_BUCKET: basecamp-feeds
          SWARM_PAYLOAD: ${{ toJSON(github.event.client_payload) != 'null' && toJSON(github.event.client_payload) || inputs.payload }}
          SWARM_MIGRATE_ONLY: ${{ inputs.migrate_only && '1' || '' }}
          SWARM_BLOCKED_VENUES: ${{ secrets.SWARM_BLOCKED_VENUES }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Tokyo
        run: npx tsx scripts/append-swarm-checkin.ts
